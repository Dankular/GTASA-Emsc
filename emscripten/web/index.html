<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTASA-Emsc Phase 1 probe</title>
  <style>
    body { margin: 2rem; background: #111827; color: #e5e7eb; font: 16px system-ui, sans-serif; }
    main { max-width: 48rem; margin: auto; }
    pre { padding: 1rem; background: #1f2937; border-radius: .5rem; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>GTASA-Emsc Phase 1 probe</h1>
    <p>This confirms the browser module contract. It is not yet the game.</p>
    <button id="launch">Unlock audio / fullscreen</button>
    <button id="save">Test IndexedDB save</button>
    <pre id="status">Loading WebAssembly module…</pre>
  </main>
  <script type="module">
    import { BrowserInput, BrowserAudioGate, SaveManager, GameRuntimeController, installLifecycle } from './browser_services.js';
    const status = document.querySelector('#status');
    const input = new BrowserInput();
    const audio = new BrowserAudioGate();
    const saves = new SaveManager();
    installLifecycle({audio});
    document.querySelector('#launch').onclick = async () => { await audio.unlock(); await document.documentElement.requestFullscreen?.(); };
    document.querySelector('#save').onclick = async () => { await saves.put('probe',{ok:true,at:Date.now(),input:input.pollGamepad()}); status.dataset.save='idbfs-ready'; };
    try {
      const factory = (await import('./sa_port_probe.js')).default;
      const module = await factory({ print: console.log, printErr: console.error });
      const phase = module._sa_port_phase();
      const emscripten = module._sa_port_is_emscripten();
      const webgpu = !!navigator.gpu;
      const boundaries = module._sa_subsystems_boundary_ready();
      const adapterSmoke = module._sa_adapter_smoke();
      const servicesSmoke = module._sa_services_smoke();
      const runtime = new GameRuntimeController(module,input);
      runtime.start();
      let adapter = null;
      let features = [];
      if (webgpu) {
        adapter = await navigator.gpu.requestAdapter();
        if (adapter) features = [...adapter.features];
      }
      status.className = 'ok';
      status.textContent = JSON.stringify({ ok: true, phase, emscripten,
        rendererTier: webgpu && adapter ? 'webgpu-core' : 'legacy-webgl2',
        webgpu, adapter: adapter?.info?.vendor || adapter?.name || null,
        optionalFeatures: features, subsystemBoundaries: boundaries === 1 ? 'all-ready' : 'incomplete',
        sdkAdapterSmoke: adapterSmoke === 0 ? 'passed' : `failed-${adapterSmoke}`,
        servicesSmoke: servicesSmoke === 0 ? 'passed' : `failed-${servicesSmoke}`, runtime: 'started',
        deviceLoss: 'controlled-state-ready', browserServices: ['input','gamepad','touch','audio-gate','fullscreen','visibility','indexeddb-save','range-vfs'] }, null, 2);
    } catch (error) {
      status.className = 'error';
      status.textContent = `Probe failed: ${error?.stack || error}`;
    }
  </script>
</body>
</html>
