<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTASA-Emsc Phase 1 probe</title>
  <style>
    body { margin: 2rem; background: #111827; color: #e5e7eb; font: 16px system-ui, sans-serif; }
    main { max-width: 48rem; margin: auto; }
    pre { padding: 1rem; background: #1f2937; border-radius: .5rem; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>GTASA-Emsc Phase 1 probe</h1>
    <p>This confirms the browser module contract. It is not yet the game.</p>
    <button id="launch">Unlock audio / fullscreen</button>
    <button id="save">Test IndexedDB save</button>
    <button id="vehicle">Enter vehicle</button>
    <button id="mission">Run mission</button>
    <button id="save-runtime">Save runtime</button>
    <button id="load-runtime">Load runtime</button>
    <canvas id="game" width="640" height="360" aria-label="GTA runtime canvas"></canvas>
    <pre id="status">Loading WebAssembly module…</pre>
  </main>
  <script type="module">
    import { BrowserInput, BrowserAudioGate, SaveManager, ContentManifest, GameRuntimeController, installLifecycle } from './browser_services.js';
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const input = new BrowserInput();
    const audio = new BrowserAudioGate();
    const saves = new SaveManager();
    installLifecycle({audio});
    document.querySelector('#launch').onclick = async () => { await audio.unlock(); await document.documentElement.requestFullscreen?.(); };
    document.querySelector('#save').onclick = async () => { await saves.put('probe',{ok:true,at:Date.now(),input:input.pollGamepad()}); status.dataset.save='idbfs-ready'; };
    try {
      const factory = (await import('./sa_port_probe.js')).default;
      const module = await factory({ print: console.log, printErr: console.error });
      const phase = module._sa_port_phase();
      const emscripten = module._sa_port_is_emscripten();
      const webgpu = !!navigator.gpu;
      const boundaries = module._sa_subsystems_boundary_ready();
      const adapterSmoke = module._sa_adapter_smoke();
      const servicesSmoke = module._sa_services_smoke();
      const draw = state => {
        ctx.fillStyle='#102030'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='#284d63'; ctx.strokeRect(20,20,600,320);
        const x=320+state.x*8, y=180-state.y*8;
        ctx.save(); ctx.translate(x,y); ctx.rotate(state.heading*Math.PI/180);
        ctx.fillStyle=state.interior?'#f59e0b':'#22c55e'; ctx.fillRect(-12,-7,24,14); ctx.restore();
        ctx.fillStyle='#d1d5db'; ctx.fillText('WASD / arrows to drive · Enter vehicle',24,345);
      };
      const runtime = new GameRuntimeController(module,input,draw);
      document.querySelector('#vehicle').onclick=()=>runtime.enterVehicle(411);
      document.querySelector('#mission').onclick=()=>{ const ok=runtime.runMission(); status.dataset.mission=ok?'passed':'failed'; };
      document.querySelector('#save-runtime').onclick=()=>{ status.dataset.runtimeSave=runtime.save('browser-runtime')?'passed':'failed'; };
      document.querySelector('#load-runtime').onclick=()=>{ status.dataset.runtimeLoad=runtime.load('browser-runtime')?'passed':'failed'; };
      runtime.start();
      const entered = runtime.enterVehicle(411);
      const mission = runtime.runMission();
      const ped = runtime.pedState(0);
      const runtimeSaved = runtime.save('acceptance-runtime');
      module._sa_runtime_tick(1, 0, 1, 0);
      const content = await ContentManifest.load('./content-manifest.json');
      const assetBytes = await content.readVerified('phase1-asset-probe');
      await saves.put('acceptance',{x:module._sa_runtime_vehicle_x(),assetBytes:assetBytes.length});
      const saved = await saves.get('acceptance');
      let adapter = null;
      let features = [];
      if (webgpu) {
        adapter = await navigator.gpu.requestAdapter();
        if (adapter) features = [...adapter.features];
      }
      status.className = 'ok';
      status.textContent = JSON.stringify({ ok: true, phase, emscripten,
        rendererTier: webgpu && adapter ? 'webgpu-core' : 'legacy-webgl2',
        webgpu, adapter: adapter?.info?.vendor || adapter?.name || null,
        optionalFeatures: features, subsystemBoundaries: boundaries === 1 ? 'all-ready' : 'incomplete',
        sdkAdapterSmoke: adapterSmoke === 0 ? 'passed' : `failed-${adapterSmoke}`,
        servicesSmoke: servicesSmoke === 0 ? 'passed' : `failed-${servicesSmoke}`, runtime: 'started',
        gameplaySmoke: entered && mission && ped.count === 1 && ped.task === 1 && ped.health === 80 && runtimeSaved && saved?.assetBytes === assetBytes.length && saved.x > 0 ? 'passed' : 'failed',
        missionSmoke: mission && ped.count === 1 && ped.task === 1 && ped.health === 80 ? 'passed' : 'failed',
        runtimeSave: runtimeSaved ? 'passed' : 'failed',
        contentManifest: { version: content.manifest.version, assets: content.entries.size },
        assetRangeRead: assetBytes.length, saveRoundTrip: !!saved,
        deviceLoss: 'controlled-state-ready', browserServices: ['input','gamepad','touch','audio-gate','fullscreen','visibility','indexeddb-save','range-vfs'] }, null, 2);
    } catch (error) {
      status.className = 'error';
      status.textContent = `Probe failed: ${error?.stack || error}`;
    }
  </script>
</body>
</html>
