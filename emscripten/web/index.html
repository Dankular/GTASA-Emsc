<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA San Andreas — Browser Runtime</title>
  <style>
    body { margin: 0; background: #07111c; color: #e5e7eb; font: 16px system-ui, sans-serif; }
    main { max-width: 72rem; margin: auto; padding: 1rem; }
    pre { padding: 1rem; background: #1f2937; border-radius: .5rem; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
    #touch-controls { display:flex; gap:.5rem; margin:.75rem 0; }
    #touch-controls button { min-width:3rem; min-height:2.5rem; touch-action:none; }
    #game { display:block; width:100%; height:min(72vh,640px); background:#091522; border:1px solid #284d63; }
    #menu { position:fixed; inset:0; display:grid; place-items:center; background:#07111cee; z-index:2; }
    #menu[hidden] { display:none !important; }
    #menu button { font-size:1.2rem; padding:.8rem 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>GTA San Andreas — Browser Runtime</h1>
    <button id="launch">Unlock audio / fullscreen</button>
    <button id="save">Test IndexedDB save</button>
    <button id="vehicle">Enter vehicle</button>
    <button id="mission">Run mission</button>
    <button id="save-runtime">Save runtime</button>
    <button id="load-runtime">Load runtime</button>
    <button id="radio">Radio</button>
    <button id="import-install">Import local install</button>
    <div id="touch-controls"><button id="touch-left">◀</button><button id="touch-accelerate">▲</button><button id="touch-brake">▼</button><button id="touch-right">▶</button></div>
    <canvas id="game" width="960" height="540" aria-label="GTA San Andreas game canvas"></canvas>
    <pre id="status">Loading WebAssembly module…</pre>
  </main>
  <section id="menu"><div><h2>San Andreas</h2><button id="new-game">New Game</button></div></section>
  <script type="module">
    import { BrowserInput, BrowserAudioGate, SaveManager, ContentManifest, UserInstallMount, WorldScene, GameRuntimeController, WebGL2Renderer, createRenderWareFixture, installLifecycle } from './browser_services.js';
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#game');
    let renderer;
    try {
      renderer = new WebGL2Renderer(canvas);
      const fixtureMesh = renderer.loadDff(createRenderWareFixture(), {name:'legal-rw-fixture', color:[0.12,0.65,0.18,1]});
      status.dataset.mesh = `dff:${fixtureMesh.count / 3} triangles`;
    } catch (error) {
      // Keep the route usable when WebGL2 shader/context creation fails.
      const ctx = canvas.getContext('2d');
      renderer = { draw(state={}) { ctx.fillStyle='#091522'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fca5a5'; ctx.fillText(`WebGL2 unavailable: ${error?.message||error}`,16,28); ctx.fillStyle='#22c55e'; ctx.fillRect(460+(state.x||0)*4,260-(state.y||0)*4,24,14); } };
      status.className='error';
      status.textContent=`Renderer fallback active: ${error?.message||error}`;
    }
    const input = new BrowserInput();
    const audio = new BrowserAudioGate();
    const saves = new SaveManager();
    installLifecycle({audio});
    document.querySelector('#import-install').onclick=async()=>{try{const mount=await UserInstallMount.pickDirectory();const sample=mount.manifest.entries.keys().next().value;status.dataset.install=`mounted:${mount.manifest.entries.size}`;status.textContent=`User install mounted (${mount.manifest.entries.size} assets); range reads remain file-backed`;if(sample)status.dataset.installProbe=(await mount.read(sample,0,Math.min(16,mount.entry(sample).size))).length;}catch(error){status.className='error';status.textContent=`Install import failed: ${error?.message||error}`;}};
    document.querySelector('#launch').onclick = async () => { await audio.unlock(); await document.documentElement.requestFullscreen?.(); };
    document.querySelector('#save').onclick = async () => { await saves.put('probe',{ok:true,at:Date.now(),input:input.pollGamepad()}); status.dataset.save='idbfs-ready'; };
    try {
      const factory = (await import('./sa_port_probe.js')).default;
      const module = await factory({ print: console.log, printErr: console.error });
      const phase = module._sa_port_phase();
      const emscripten = module._sa_port_is_emscripten();
      const webgpu = !!navigator.gpu;
      const boundaries = module._sa_subsystems_boundary_ready();
      const adapterSmoke = module._sa_adapter_smoke();
      const servicesSmoke = module._sa_services_smoke();
      const scene = new WorldScene();
      const runtime = new GameRuntimeController(module,input,state => { state.scene=scene.update(state.x,state.y); renderer.draw(state); status.dataset.world=`sector:${state.scene.sector} loaded:${state.scene.loadedSectors} instances:${state.scene.instances.length}`; });
      input.bindTouchControls({accelerate:document.querySelector('#touch-accelerate'),reverse:document.querySelector('#touch-brake'),left:document.querySelector('#touch-left'),right:document.querySelector('#touch-right')});
      installLifecycle({audio,canvas,runtime});
      document.querySelector('#vehicle').onclick=()=>runtime.enterVehicle(411);
      document.querySelector('#mission').onclick=()=>{ const ok=runtime.runMission(); if(ok)audio.playMission('mission-start'); status.dataset.mission=ok?'passed':'failed'; };
      document.querySelector('#radio').onclick=async()=>{await audio.unlock();audio.playRadio('Playback FM','radio-track-1');status.dataset.radio=audio.drain(performance.now()/1000).length?'scheduled':'failed';};
      document.querySelector('#save-runtime').onclick=async()=>{ status.dataset.runtimeSave=await runtime.saveToBrowser(saves,'browser-runtime')?'passed':'failed'; };
      document.querySelector('#load-runtime').onclick=async()=>{ status.dataset.runtimeLoad=await runtime.loadFromBrowser(saves,'browser-runtime')?'passed':'failed'; };
      let entered = false, mission = false;
      document.querySelector('#new-game').onclick=async()=>{try{await audio.unlock();const menu=document.querySelector('#menu');menu.hidden=true;menu.style.display='none';const ok=runtime.startRoute({audio});entered=ok;mission=ok;status.className=ok?'ok':'error';status.textContent=ok?'New game started — streaming world / mission route':'New game failed to start';}catch(error){status.className='error';status.textContent=`New game failed: ${error?.stack||error}`;}};
      const routeTimer=setInterval(async()=>{const r=runtime.route;if(r.phase==='complete'&&!r.saved){r.saved=await runtime.saveToBrowser(saves,'p1-route');status.textContent=`Route ${r.saved?'complete — save written':'save failed'} · vehicle → mission → interior`; }},100);
      const content = await ContentManifest.load('./content-manifest.json');
      const assetBytes = await content.readVerified('phase1-asset-probe');
      let adapter = null;
      let features = [];
      if (webgpu) {
        adapter = await navigator.gpu.requestAdapter();
        if (adapter) features = [...adapter.features];
      }
      status.className = 'ok';
      status.textContent = JSON.stringify({ ok: true, phase, emscripten,
        rendererTier: webgpu && adapter ? 'webgpu-core' : 'legacy-webgl2',
        webgpu, adapter: adapter?.info?.vendor || adapter?.name || null,
        optionalFeatures: features, subsystemBoundaries: boundaries === 1 ? 'all-ready' : 'incomplete',
        sdkAdapterSmoke: adapterSmoke === 0 ? 'passed' : `failed-${adapterSmoke}`,
        servicesSmoke: servicesSmoke === 0 ? 'passed' : `failed-${servicesSmoke}`, runtime: 'menu-ready',
        contentManifest: { version: content.manifest.version, assets: content.entries.size },
        assetRangeRead: assetBytes.length,
        deviceLoss: 'controlled-state-ready', browserServices: ['input','gamepad','touch','audio-gate','fullscreen','visibility','indexeddb-save','range-vfs'] }, null, 2);
    } catch (error) {
      status.className = 'error';
      status.textContent = `Probe failed: ${error?.stack || error}`;
    }
  </script>
</body>
</html>
